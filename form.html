
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>無料相談フォーム</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <style>
    body {
      background-color: transparent;
      font-family: 'Segoe UI', sans-serif;
      padding: 0;
      margin: 0;
      color: #333;
    }
    .form-wrapper {
      background: #fff;
      border-radius: 16px;
      padding: 20px 15px 100px;
      width: 100%; max-width: 640px;
      margin: 50px auto;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
    }
    h2 {
      color: #e75f4f;
      text-align: center;
      font-size: 36px;
    }
    .step-indicator {
      display: flex;
      justify-content: space-between;
      margin-bottom: 30px;
      font-family: 'Poppins', sans-serif;
    }
    .step-indicator div {
      flex: 1;
      text-align: center;
      padding: 10px 5px;
      font-size: 14px;
      background: #eee;
      color: #999;
      border-radius: 20px;
      margin: 0 4px;
      transition: background 0.3s ease;
      box-shadow: 0 2px 5px rgba(0,0,0,0.15);
    }
    .step-indicator .active {
      background: #e75f4f;
      color: white;
      font-weight: bold;
    }
    .step {
      display: none;
    }
    .step.active {
      display: block;
    }
    label {
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 20px;
      font-family: 'KoburinaW6', sans-serif;
    }
    .label-icon {
      width: 16px;
      height: 16px;
      background-color: #e75f4f;
      border-radius: 50%;
    }
    input, select {
      width: 100%;
      padding: 12px;
      margin-top: 8px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 15px;
      box-sizing: border-box;
    }
    .radio-group {
      margin-top: 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .radio-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .radio-option {
      display: flex;
      align-items: center;
      font-family: 'KoburinaW3', sans-serif;
      font-size: 16px;
      gap: 10px;
    }
    .radio-option input[type="radio"] {
      transform: scale(1.5);
    }
    .btn-group {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 60px;
    }
    .btn {
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
    }
    .btn-back { background-color: #ccc; color: #333; }
    .btn-next { background-color: #e75f4f; color: white; }
  </style>
</head>
<body>
<div class="form-wrapper">
  <h2>無料相談はこちらから</h2>
  <div class="step-indicator">
    <div id="nav0" class="active">STEP1</div>
    <div id="nav1">STEP2</div>
    <div id="nav2">STEP3</div>
    <div id="nav3">STEP4</div>
    <div id="nav4">STEP5</div>
    <div id="nav5">STEP6</div>
  </div>
  <form id="stepForm">
    <div class="step active">
      <label><span class="label-icon"></span> お名前を入力してください</label>

      <input type="text" required />
      <div class="btn-group"><button type="button" class="btn btn-next" onclick="nextStep()">次へ</button></div>
    </div>
    <div class="step">
      <label><span class="label-icon"></span> 現在の就業状況について</label>

      <div class="radio-group">
  <label class="radio-option">
        <label class="radio-option"><input type="radio" name="jobStatus" value="在籍中" required /> 在籍中</label>

        <label class="radio-option"><input type="radio" name="jobStatus" value="離職中" /> 離職中</label>

      </div>
      <div class="btn-group">
        <button type="button" class="btn btn-back" onclick="prevStep()">戻る</button>
        <button type="button" class="btn btn-next" onclick="nextStep()">次へ</button>
      </div>
    </div>
    <div class="step">
      <label><span class="label-icon"></span> 転職希望時期</label>

      <div class="radio-group">
  <label class="radio-option">
        <label class="radio-option"><input type="radio" name="startTime" value="今すぐ就職・転職したい" required /> 今すぐ就職・転職したい</label>

        <label class="radio-option"><input type="radio" name="startTime" value="まずは相談したい" /> まずは相談したい</label>

      </div>
      <div class="btn-group">
        <button type="button" class="btn btn-back" onclick="prevStep()">戻る</button>
        <button type="button" class="btn btn-next" onclick="nextStep()">次へ</button>
      </div>
    </div>
    <div class="step">
      <label><span class="label-icon"></span> ご希望の勤務地</label>

      <select required>
        <option value="">選択してください</option>
        <option>東京都</option><option>神奈川県</option><option>千葉県</option><option>埼玉県</option>
        <option>愛知県</option><option>大阪府</option><option>福岡県</option>
      </select>
      <div class="btn-group">
        <button type="button" class="btn btn-back" onclick="prevStep()">戻る</button>
        <button type="button" class="btn btn-next" onclick="nextStep()">次へ</button>
      </div>
    </div>
    <div class="step">
      <label><span class="label-icon"></span> 最終学歴について</label>

      <select required>
        <option value="">選択してください</option>
        <option>中卒・高卒</option><option>専門・高専卒</option>
        <option>短大卒</option><option>大学卒</option><option>大学院卒</option>
      </select>
      <div class="btn-group">
        <button type="button" class="btn btn-back" onclick="prevStep()">戻る</button>
        <button type="button" class="btn btn-next" onclick="nextStep()">次へ</button>
      </div>
    </div>
    <div class="step">
      <label><span class="label-icon"></span> 年齢</label>

      <select required>
<option>18</option><option>19</option><option>20</option><option>21</option><option>22</option><option>23</option><option>24</option><option>25</option><option>26</option><option>27</option><option>28</option><option>29</option><option>30</option><option>31</option><option>32</option><option>33</option><option>34</option>
      </select>
      <label><span class="label-icon"></span> 電話番号</label>

      <input type="tel" required />
      <label><span class="label-icon"></span> メールアドレス</label>

      <input type="email" required />
      <div class="btn-group">
        <button type="button" class="btn btn-back" onclick="prevStep()">戻る</button>
        <button type="submit" class="btn btn-next">送信</button>
      </div>
    </div>
  </form>
</div>
<script>
let currentStep = 0;
const steps = document.querySelectorAll('.step');
const navItems = document.querySelectorAll('.step-indicator div');

function showStep(index) {
  steps.forEach((step, i) => step.classList.toggle('active', i === index));
  navItems.forEach((nav, i) => nav.classList.toggle('active', i === index));
}
function validateStep(index) {
  const inputs = steps[index].querySelectorAll("input, select");
  for (const input of inputs) {
    if (input.type === "radio") {
      const group = steps[index].querySelectorAll(`input[name='${input.name}']`);
      if (![...group].some(r => r.checked)) return alert("選択してください。"), false;
    } else if (input.hasAttribute("required") && !input.value.trim()) {
      alert("必須項目が未入力です。");
      return false;
    }
  }
  return true;
}
function nextStep() {
  if (validateStep(currentStep)) {
    if (currentStep < steps.length - 1) {
      currentStep++;
      showStep(currentStep);
    }
  }
}
function prevStep() {
  if (currentStep > 0) {
    currentStep--;
    showStep(currentStep);
  }
}

document.getElementById('stepForm').addEventListener('submit', function(e) {
  e.preventDefault();
  const data = {
    name: document.querySelector('input[type="text"]').value,
    jobStatus: document.querySelector('input[name="jobStatus"]:checked')?.value || '',
    startTime: document.querySelector('input[name="startTime"]:checked')?.value || '',
    location: document.querySelectorAll('select')[0].value,
    education: document.querySelectorAll('select')[1].value,
    age: document.querySelectorAll('select')[2].value,
    phone: document.querySelectorAll('input[type="tel"]')[0].value,
    email: document.querySelectorAll('input[type="email"]')[0].value
  };

  fetch("https://script.google.com/macros/s/AKfycbzx_FG4t4mMoosBEUpl6BtQhqEvlIsc-0mSQ5TiqmIHy8u2gcyVkUN19DJpT7UJ7URILw/exec", {
    method: "POST",
    body: JSON.stringify(data),
    headers: { "Content-Type": "application/json" }
  })
  .then(res => res.json())
  .then(res => {
    if (res.result === "success") {
      alert("送信完了しました。ありがとうございました！");
    } else {
      alert("送信に失敗しました。");
    }
  })
  .catch(err => {
    console.error(err);
    alert("通信エラーが発生しました。");
  });
});

showStep(currentStep);
</script>
</body>
</html>
